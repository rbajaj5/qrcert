name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: "true"
          build-args: --wfail
          use-github-cache: "false"
      - name: Audit theorem dependencies
        run: lake env lean -E warning QRCertAxiomAudit.lean
      - name: Reject incomplete or unsafe Lean declarations
        run: |
          if rg -n --glob '*.lean' '\b(sorry|admit|unsafe|partial)\b|^\s*axiom\b' .; then
            exit 1
          fi

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Compile tools
        run: python -m py_compile tools/ramsey_gpu.py tools/benchmark_ramsey.py
      - name: Check reflected Ramsey examples on the exact CPU path
        run: |
          python tools/ramsey_gpu.py --self-test --device cpu --output /tmp/c5.json
          python tools/ramsey_gpu.py --check /tmp/c5.json --device cpu --output /tmp/c5-roundtrip.json
          cmp /tmp/c5.json /tmp/c5-roundtrip.json
          python tools/ramsey_gpu.py --check examples/r55-42.json --device cpu --output /tmp/r55.json
          cmp examples/r55-42.json /tmp/r55.json
      - name: Test reusable GPU-plan structure on the CPU-only path
        run: python -m unittest tools/test_ramsey_gpu.py

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/qrcert-checker
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: nightly-2026-06-01
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy without warnings
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run debug and release tests
        run: |
          cargo test --locked
          cargo test --locked --release

  rust-to-lean-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Free runner space for the pinned bridge toolchains
        run: |
          for path in \
              /usr/local/lib/android \
              /usr/share/dotnet \
              /opt/ghc \
              /usr/local/.ghcup; do
            resolved=$(realpath -e "$path" 2>/dev/null || true)
            case "$resolved" in
              "") ;;
              "$path") sudo rm -rf -- "$resolved" ;;
              *) echo "refusing to remove unexpected path: $resolved" >&2; exit 1 ;;
            esac
          done
          df -h /
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"
      - name: Reproduce pinned Charon/Aeneas extraction and compile generated Lean
        run: bash bridge/extract.sh
